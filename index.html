<title>MOHAMMAD SAT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#a8c0ff,#c2a8ff,#ffa8e8);color:#292939;min-height:100vh}
header{margin:14px;padding:25px 15px 30px;text-align:center;border-radius:28px;background:#ffffffaa;border:1px solid #ffffffdd}
.logo{width:120px;height:120px;border-radius:50%;padding:4px;background:#fff;margin:auto;box-shadow:0 4px 15px #0002}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
h1{color:#5c4db8;margin:22px 0 6px;font-size:30px;font-weight:bold}
.sub{color:#7a6dc9;font-size:15px}
.tools{max-width:1100px;margin:15px auto;padding:0 15px;display:flex;gap:10px;flex-wrap:wrap}
input,select{border:0;border-radius:18px;padding:14px;font-size:15px;outline:0;box-shadow:0 3px 12px #0001}
#search{flex:1;min-width:220px}
.cats{display:flex;gap:8px;overflow:auto;padding:0 15px 10px;max-width:1100px;margin:auto}
.cat{border:0;border-radius:18px;padding:10px 16px;background:#ffffffcc;color:#5c4db8;white-space:nowrap;cursor:pointer;font-weight:bold;box-shadow:0 3px 10px #0001}
.cat.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.count{text-align:center;color:#5c4db8;font-weight:bold;margin:5px 0}
.grid{max-width:1100px;margin:auto;padding:10px 15px 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:#fff;border-radius:24px;padding:12px;text-align:center;box-shadow:0 8px 25px #4a3b8c22;position:relative;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.appimg{width:105px;height:105px;margin:5px auto 12px;border-radius:23px;background:#f0eeff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.appimg img{width:100%;height:100%;object-fit:cover}
.ph{font-size:24px;font-weight:bold;color:#667eea}
.name{font-weight:bold;font-size:17px;min-height:45px;display:flex;align-items:center;justify-content:center;color:#333}
.download{display:block;background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;text-decoration:none;border-radius:20px;padding:11px;font-weight:bold;margin-top:8px;box-shadow:0 4px 12px #667eea55}
@media(max-width:700px){
.grid{gap:9px;padding:8px 9px 25px;grid-template-columns:repeat(2,1fr)}
.card{padding:8px 5px;border-radius:19px}
.appimg{width:85px;height:85px}
.name{font-size:13px;min-height:40px}
.download{font-size:12px;padding:9px 3px}
header{margin:9px}
.logo{width:105px;height:105px}
h1{font-size:25px}
}
</style>

let active="الكل";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
  let q=search.value.toLowerCase().trim();
  let list=data.apps.filter(a=>(active==="الكل"||a.category===active)&&((a.name+" "+a.category).toLowerCase().includes(q)));
  count.textContent="عدد التطبيقات: "+list.length;
  grid.innerHTML=list.map(a=>`<article class="card">
    <div class="appimg">${a.image?`<img src="${esc(a.image)}">`:`<div class="ph">APP</div>`}</div>

  </article>`).join("");
}
function categories(){
  let cs=["الكل",...new Set(data.apps.map(a=>a.category||"عام"))];
  cats.innerHTML=cs.map(c=>`<button class="cat ${c===active?"active":""}" onclick='active=${JSON.stringify(c)};categories();render()'>${esc(c)}</button>`).join("");
}
