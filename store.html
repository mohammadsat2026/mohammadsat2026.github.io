<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رامي للستلايت - متجرك الأول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Tahoma, Arial, sans-serif; background: #f8f7fc; color: #333; }

/* الهيدر */
header {
    background: linear-gradient(135deg, #2d1b69, #5c4db8, #764ba2);
    color: white;
    padding: 15px 20px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(45,27,105,0.3);
}
.header-top { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: auto; }
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-area img { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #ffd700; }
.logo-area h1 { font-size: 22px; color: #ffd700; }
.header-actions { display: flex; gap: 15px; align-items: center; }
.icon-btn {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 45px; height: 45px; border-radius: 50%; font-size: 20px;
    cursor: pointer; position: relative; transition: 0.3s;
}
.icon-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }
.badge {
    position: absolute; top: -5px; left: -5px;
    background: #ffd700; color: #2d1b69;
    font-size: 12px; font-weight: bold;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
}

/* العنوان الترحيبي */
.hero {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; text-align: center;
    padding: 40px 20px;
}
.hero h2 { font-size: 28px; margin-bottom: 10px; }
.hero p { font-size: 16px; opacity: 0.9; }

/* خانة البحث */
.search-box {
    max-width: 700px; margin: -25px auto 0;
    position: relative; z-index: 10; padding: 0 20px;
}
.search-box input {
    width: 100%; padding: 16px 50px 16px 20px;
    border: none; border-radius: 50px;
    font-size: 16px; font-family: inherit;
    box-shadow: 0 8px 25px rgba(102,126,234,0.25);
    outline: none;
}
.search-box::before {
    content: '🔍'; position: absolute;
    right: 40px; top: 50%; transform: translateY(-50%);
    font-size: 20px; pointer-events: none;
}

/* التصنيفات */
.categories {
    max-width: 1200px; margin: 25px auto;
    padding: 0 20px;
    display: flex; gap: 10px; overflow-x: auto;
    flex-wrap: wrap; justify-content: center;
}
.cat-btn {
    padding: 10px 22px; border-radius: 50px;
    border: 2px solid #5c4db8; background: white;
    color: #5c4db8; font-weight: bold; font-size: 14px;
    cursor: pointer; transition: 0.3s; font-family: inherit;
    white-space: nowrap;
}
.cat-btn:hover, .cat-btn.active {
    background: linear-gradient(135deg, #5c4db8, #764ba2);
    color: white; transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(92,77,184,0.4);
}

/* شبكة المنتجات */
.products-grid {
    max-width: 1200px; margin: 30px auto;
    padding: 0 20px 50px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
}

.product-card {
    background: white; border-radius: 20px;
    overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: 0.3s; position: relative;
}
.product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(102,126,234,0.2); }

.product-img {
    width: 100%; height: 200px;
    background: #f0eeff; display: flex;
    align-items: center; justify-content: center;
    font-size: 50px; color: #5c4db8;
    overflow: hidden;
}
.product-img img { width: 100%; height: 100%; object-fit: cover; }

.fav-btn {
    position: absolute; top: 12px; right: 12px;
    background: white; border: none;
    width: 40px; height: 40px; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    transition: 0.3s;
}
.fav-btn:hover { transform: scale(1.15); }
.fav-btn.active { background: #ff4757; color: white; }

.product-info { padding: 15px; }
.product-cat {
    font-size: 12px; color: #999;
    margin-bottom: 5px;
}
.product-name {
    font-size: 16px; font-weight: bold;
    color: #2d1b69; margin-bottom: 10px;
    min-height: 44px;
}
.product-price {
    font-size: 20px; font-weight: bold;
    color: #5c4db8; margin-bottom: 12px;
}
.product-price span { font-size: 14px; color: #999; }

.order-btn {
    display: block; width: 100%;
    padding: 12px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white; font-size: 14px; font-weight: bold;
    cursor: pointer; font-family: inherit;
    text-align: center; text-decoration: none;
    transition: 0.3s;
}
.order-btn:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(37,211,102,0.4); }

/* السلة والمفضلة (Sidebar) */
.sidebar {
    position: fixed; top: 0; left: -400px;
    width: 380px; max-width: 90%;
    height: 100vh; background: white;
    z-index: 999; box-shadow: -5px 0 30px rgba(0,0,0,0.2);
    transition: 0.4s; display: flex; flex-direction: column;
}
.sidebar.open { left: 0; }
.sidebar-header {
    background: linear-gradient(135deg, #5c4db8, #764ba2);
    color: white; padding: 20px;
    display: flex; justify-content: space-between; align-items: center;
}
.sidebar-header h3 { font-size: 20px; }
.close-btn {
    background: rgba(255,255,255,0.2); border: none;
    color: white; width: 35px; height: 35px;
    border-radius: 50%; font-size: 18px; cursor: pointer;
}
.sidebar-body { flex: 1; overflow-y: auto; padding: 15px; }
.empty-msg {
    text-align: center; color: #999;
    padding: 40px 20px; font-size: 15px;
}

.overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 998; display: none;
}
.overlay.show { display: block; }

/* الفوتر */
footer {
    background: linear-gradient(135deg, #2d1b69, #5c4db8);
    color: white; text-align: center;
    padding: 30px 20px;
}
footer h3 { color: #ffd700; font-size: 20px; margin-bottom: 10px; }
footer p { font-size: 13px; opacity: 0.9; margin: 5px 0; }

/* زر واتساب عائم */
.float-wa {
    position: fixed; bottom: 20px; left: 20px;
    width: 60px; height: 60px; border-radius: 50%;
    background: #25D366; color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; text-decoration: none;
    box-shadow: 0 5px 20px rgba(37,211,102,0.5);
    z-index: 500; transition: 0.3s;
}
.float-wa:hover { transform: scale(1.1); }

@media (max-width: 600px) {
    .logo-area h1 { font-size: 16px; }
    .logo-area img { width: 45px; height: 45px; }
    .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 10px 30px; }
    .product-img { height: 140px; }
    .product-name { font-size: 13px; min-height: 40px; }
    .product-price { font-size: 16px; }
    .order-btn { font-size: 12px; padding: 10px; }
    .hero h2 { font-size: 20px; }
    .cat-btn { padding: 8px 15px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- الهيدر -->
<header>
    <div class="header-top">
        <div class="logo-area">
            <img src="logo.png" alt="رامي للستلايت">
            <h1>رامي للستلايت</h1>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openFav()">
                ❤️ <span class="badge" id="fav-count">0</span>
            </button>
            <button class="icon-btn" onclick="openCart()">
                🛒 <span class="badge" id="cart-count">0</span>
            </button>
        </div>
    </div>
</header>

<!-- العنوان الترحيبي -->
<div class="hero">
    <h2>🎉 أهلاً بيك في متجر رامي للستلايت</h2>
    <p>كل ما تحتاجه لستلايتك في مكان واحد</p>
</div>

<!-- خانة البحث -->
<div class="search-box">
    <input type="text" id="search" placeholder="ابحث عن منتج...">
</div>

<!-- التصنيفات -->
<div class="categories" id="categories">
    <button class="cat-btn active" onclick="filterCat('all', this)">🏠 الكل</button>
    <button class="cat-btn" onclick="filterCat('iptv', this)">📺 اشتراكات IPTV</button>
    <button class="cat-btn" onclick="filterCat('receivers', this)">📡 ريسيفرات</button>
    <button class="cat-btn" onclick="filterCat('screens', this)">📺 شاشات</button>
    <button class="cat-btn" onclick="filterCat('holders', this)">🔌 حمالات</button>
    <button class="cat-btn" onclick="filterCat('tools', this)">🛠️ عدة وأدوات</button>
    <button class="cat-btn" onclick="filterCat('offers', this)">🎁 عروض خاصة</button>
</div>

<!-- شبكة المنتجات -->
<div class="products-grid" id="products"></div>

<!-- السلة -->
<div class="sidebar" id="cart-sidebar">
    <div class="sidebar-header">
        <h3>🛒 سلة التسوق</h3>
        <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="sidebar-body" id="cart-body">
        <div class="empty-msg">السلة فاضية 🛒<br>ابدأ التسوق!</div>
    </div>
</div>

<!-- المفضلة -->
<div class="sidebar" id="fav-sidebar">
    <div class="sidebar-header">
        <h3>❤️ المفضلة</h3>
        <button class="close-btn" onclick="closeFav()">✕</button>
    </div>
    <div class="sidebar-body" id="fav-body">
        <div class="empty-msg">ما في منتجات بالمفضلة ❤️</div>
    </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- زر واتساب عائم -->
<a href="https://wa.me/962797639392" target="_blank" class="float-wa">💬</a>

<!-- الفوتر -->
<footer>
    <h3>رامي للستلايت</h3>
    <p>📞 0797639392</p>
    <p>💳 الدفع عند التسليم أو كليك</p>
    <p style="margin-top:15px; font-size:11px; opacity:0.7;">© 2026 — جميع الحقوق محفوظة</p>
</footer>

<script>
// بيانات المنتجات - عدلها حسب حاجتك
const products = [
    { id: 1, name: "اشتراك IPTV - شهر", category: "iptv", price: 5, image: "", icon: "📺" },
    { id: 2, name: "اشتراك IPTV - 3 أشهر", category: "iptv", price: 12, image: "", icon: "📺" },
    { id: 3, name: "اشتراك IPTV - سنة", category: "iptv", price: 35, image: "", icon: "📺" },
    { id: 4, name: "رسيفر Android Box", category: "receivers", price: 50, image: "", icon: "📡" },
    { id: 5, name: "رسيفر 4K", category: "receivers", price: 80, image: "", icon: "📡" },
    { id: 6, name: "حمالة شاشة", category: "holders", price: 15, image: "", icon: "🔌" },
    { id: 7, name: "شاشة 32 بوصة", category: "screens", price: 120, image: "", icon: "📺" },
    { id: 8, name: "عدة تركيب", category: "tools", price: 25, image: "", icon: "🛠️" },
];

let cart = JSON.parse(localStorage.getItem('cart') || '[]');
let fav = JSON.parse(localStorage.getItem('fav') || '[]');
let activeCat = 'all';

function renderProducts() {
    const search = document.getElementById('search').value.toLowerCase();
    const filtered = products.filter(p => {
        const matchCat = activeCat === 'all' || p.category === activeCat;
        const matchSearch = p.name.toLowerCase().includes(search);
        return matchCat && matchSearch;
    });

    const grid = document.getElementById('products');
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">ما في منتجات مطابقة 🔍</div>';
        return;
    }

    grid.innerHTML = filtered.map(p => `
        <div class="product-card">
            <button class="fav-btn ${fav.includes(p.id) ? 'active' : ''}" onclick="toggleFav(${p.id})">
                ${fav.includes(p.id) ? '❤️' : '🤍'}
            </button>
            <div class="product-img">
                ${p.image ? `<img src="${p.image}" alt="${p.name}">` : p.icon}
            </div>
            <div class="product-info">
                <div class="product-cat">${getCatName(p.category)}</div>
                <div class="product-name">${p.name}</div>
                <div class="product-price">${p.price} <span>د.أ</span></div>
                <button class="order-btn" onclick="addToCart(${p.id})">🛒 أضف للسلة</button>
            </div>
        </div>
    `).join('');
}

function getCatName(cat) {
    const names = {
        iptv: 'اشتراكات IPTV',
        receivers: 'ريسيفرات',
        screens: 'شاشات',
        holders: 'حمالات',
        tools: 'عدة وأدوات',
        offers: 'عروض خاصة'
    };
    return names[cat] || cat;
}

function filterCat(cat, btn) {
    activeCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts();
}

document.getElementById('search').addEventListener('input', renderProducts);

// السلة
function addToCart(id) {
    const p = products.find(x => x.id === id);
    const existing = cart.find(x => x.id === id);
    if (existing) {
        existing.qty++;
    } else {
        cart.push({ ...p, qty: 1 });
    }
    saveCart();
    alert('✅ تم إضافة المنتج للسلة');
}

function saveCart() {
    localStorage.setItem('cart', JSON.stringify(cart));
    document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.qty, 0);
    renderCart();
}

function renderCart() {
    const body = document.getElementById('cart-body');
    if (cart.length === 0) {
        body.innerHTML = '<div class="empty-msg">السلة فاضية 🛒</div>';
        return;
    }
    let total = 0;
    let html = cart.map(item => {
        total += item.price * item.qty;
        return `
            <div style="display:flex; gap:10px; padding:12px; border-bottom:1px solid #eee; align-items:center;">
                <div style="font-size:30px;">${item.icon}</div>
                <div style="flex:1;">
                    <div style="font-weight:bold; font-size:14px;">${item.name}</div>
                    <div style="color:#5c4db8; font-weight:bold;">${item.price} د.أ × ${item.qty}</div>
                </div>
                <button onclick="removeFromCart(${item.id})" style="background:#ff4757; color:white; border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;">✕</button>
            </div>
        `;
    }).join('');

    html += `
        <div style="padding:20px; text-align:center; border-top:2px solid #5c4db8;">
            <div style="font-size:20px; font-weight:bold; color:#2d1b69; margin-bottom:15px;">
                الإجمالي: ${total} د.أ
            </div>
            <a href="https://wa.me/962797639392?text=${encodeURIComponent('مرحبا، بدي أطلب:\n' + cart.map(i => `- ${i.name} × ${i.qty}`).join('\n') + `\n\nالإجمالي: ${total} د.أ`)}" 
               target="_blank"
               style="display:block; padding:15px; background:linear-gradient(135deg,#25D366,#128C7E); color:white; text-decoration:none; border-radius:12px; font-weight:bold;">
                💬 اطلب على واتساب
            </a>
        </div>
    `;
    body.innerHTML = html;
}

function removeFromCart(id) {
    cart = cart.filter(x => x.id !== id);
    saveCart();
}

// المفضلة
function toggleFav(id) {
    if (fav.includes(id)) {
        fav = fav.filter(x => x !== id);
    } else {
        fav.push(id);
    }
    localStorage.setItem('fav', JSON.stringify(fav));
    document.getElementById('fav-count').textContent = fav.length;
    renderProducts();
    renderFav();
}

function renderFav() {
    const body = document.getElementById('fav-body');
    if (fav.length === 0) {
        body.innerHTML = '<div class="empty-msg">ما في منتجات بالمفضلة ❤️</div>';
        return;
    }
    body.innerHTML = fav.map(id => {
        const p = products.find(x => x.id === id);
        if (!p) return '';
        return `
            <div style="display:flex; gap:10px; padding:12px; border-bottom:1px solid #eee; align-items:center;">
                <div style="font-size:30px;">${p.icon}</div>
                <div style="flex:1;">
                    <div style="font-weight:bold; font-size:14px;">${p.name}</div>
                    <div style="color:#5c4db8; font-weight:bold;">${p.price} د.أ</div>
                </div>
                <button onclick="addToCart(${p.id})" style="background:#25D366; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">🛒</button>
            </div>
        `;
    }).join('');
}

// Sidebar
function openCart() {
    document.getElementById('cart-sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
}
function closeCart() {
    document.getElementById('cart-sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
}
function openFav() {
    document.getElementById('fav-sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
}
function closeFav() {
    document.getElementById('fav-sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
}
function closeAll() {
    document.querySelectorAll('.sidebar').forEach(s => s.classList.remove('open'));
    document.getElementById('overlay').classList.remove('show');
}

// تشغيل
renderProducts();
saveCart();
renderFav();
</script>

</body>
</html>
